name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # 插件本身依赖 Windows 的注册表与 libraryfolders.vdf 发现逻辑，
    # 保持与目标平台一致，避免路径差异导致的假失败。
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 语法检查
        run: |
          node --check main.js
          node --check wallpaper-source.js
          node --check renderer/index.mjs
          node --check tests/pack-check.js
          node --check tests/test-legacy.js
          node --check tests/test-startup-sweep.js

      - name: manifest 校验
        run: |
          node -e "const m=JSON.parse(require('fs').readFileSync('manifest.json','utf8'));const re=/^[a-z0-9]+(\.[a-z0-9_-]+)+$/;if(!re.test(m.id))throw new Error('bad id: '+m.id);if(!m.main)throw new Error('missing main');if(!require('fs').existsSync(m.main))throw new Error('main not found');if(m.renderer&&!require('fs').existsSync(m.renderer))throw new Error('renderer not found');console.log('manifest ok:',m.id,m.version)"

      - name: 单元测试（不依赖本机壁纸库）
        run: |
          node tests/test-legacy.js
          node tests/test-startup-sweep.js

      - name: 打包产物完整性
        run: node tests/pack-check.js

  # 依赖真实 Wallpaper Engine 壁纸库的测试放在 tests/manual/，不进 CI。
  # 这些脚本会扫描本机 Steam 库、遍历真实壁纸、读写上百 MB 的载荷缓存，
  # 在没有装 WE 的 runner 上必然失败，因此只在本机手动执行：
  #   test-main.js         扫描 + 分块 RPC 端到端
  #   test-payload.js      载荷生成与容量淘汰
  #   test-timeout.js      首次生成耗时是否在宿主超时线内
  #   test-renderer.js     渲染层（需要真实壁纸列表做断言）
  #   test-unload-inflight.js 卸载竞态（同样需要真实壁纸）
  #   test-debug-payload.js   排障用，输出载荷头尾
